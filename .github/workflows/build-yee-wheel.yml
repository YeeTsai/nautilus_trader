name: build-yee-wheel

permissions:
  contents: write
  actions: read

on:
  push:
    tags:
      - "v*-yee.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag, for example v1.224.0-yee.1"
        required: true
        type: string

env:
  BUILD_MODE: release
  RUST_BACKTRACE: 1
  YEE_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-linux-arm64:
    name: build wheel (linux aarch64, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
    steps:
      - uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "$YEE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-yee\.[0-9]+$ ]]; then
            echo "Invalid release tag: $YEE_RELEASE_TAG"
            echo "Expected format: v1.224.0-yee.1"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "branch" && ! "${GITHUB_REF_NAME:-}" =~ ^yeslab-[0-9]+\.[0-9]+$ ]]; then
            echo "Manual dispatch must run from a yeslab release branch, for example yeslab-1.224."
            echo "Current ref: ${GITHUB_REF_NAME:-unknown}"
            exit 1
          fi

          base_tag="${YEE_RELEASE_TAG%-yee.*}"
          base_version="${base_tag#v}"
          current_version=$(grep '^version = ' pyproject.toml | cut -d '"' -f2)

          if ! git rev-parse -q --verify "refs/tags/${base_tag}^{commit}" >/dev/null; then
            echo "Missing base release tag: ${base_tag}"
            echo "Push the upstream base tag to this fork before tagging ${YEE_RELEASE_TAG}."
            echo "Example: git push fork ${base_tag}"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$base_tag" HEAD; then
            echo "Current commit is not based on ${base_tag}."
            echo "Create the yeslab release branch from ${base_tag}, apply patches, then tag it."
            exit 1
          fi

          if [[ "$current_version" != "$base_version" ]]; then
            echo "pyproject.toml version (${current_version}) does not match base tag ${base_tag} (${base_version})."
            echo "Do not build a ${YEE_RELEASE_TAG} wheel from an unrelated develop snapshot."
            exit 1
          fi

          echo "Base release tag: ${base_tag}"

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          build-type: release
          free-disk-space: "true"

      - name: Set package version from release tag
        run: |
          set -euo pipefail
          version="${YEE_RELEASE_TAG#v}"
          version="${version/-yee./+yee.}"
          sed -i.bak -E "s/^version = \".*\"/version = \"${version}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          grep '^version = ' pyproject.toml

      - name: Build and install wheel
        uses: ./.github/actions/common-wheel-build
        with:
          python-version: ${{ matrix.python-version }}
          github_ref: refs/tags/${{ env.YEE_RELEASE_TAG }}

      - name: Show original wheel platform tag
        run: |
          set -euo pipefail
          python -m pip install auditwheel
          ls -lh dist/
          for whl in dist/*.whl; do
            echo "=== $whl ==="
            python -m auditwheel show "$whl"
          done

      - name: Repair wheel for AL2023 compatibility
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y patchelf -o Acquire::Retries=5
          mkdir -p wheelhouse
          for whl in dist/*.whl; do
            python -m auditwheel repair "$whl" \
              --plat manylinux_2_34_aarch64 \
              -w wheelhouse/
          done
          ls -lh wheelhouse/
          for whl in wheelhouse/*.whl; do
            echo "=== $whl ==="
            python -m auditwheel show "$whl"
          done

      - name: Upload repaired wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nautilus-trader-${{ env.YEE_RELEASE_TAG }}-cp312-manylinux_2_34_aarch64
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload repaired wheel to GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ env.YEE_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: wheelhouse/*.whl
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
